<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ceylon Letter Co. – Shop our full collection of premium tech products. Headphones, earbuds, iPhones, MacBooks and more.">
  <title>Ceylon Letter Co. – Shop All Products</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500" rel="stylesheet">

  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/navbar.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/footer.css">

  <style>
    /* ── Products Page Specific ── */
    .products-page-hero {
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border);
      padding: 48px 32px;
      text-align: center;
    }
    .products-page-hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 52px);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--black);
      margin-bottom: 8px;
    }
    .products-page-hero p {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0;
    }

    .filter-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .filter-tag {
      padding: 7px 16px;
      border: 1.5px solid var(--border);
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font-display);
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      cursor: pointer;
      background: var(--white);
      transition: all 0.2s;
    }
    .filter-tag:hover,
    .filter-tag.active {
      background: var(--black);
      border-color: var(--black);
      color: var(--white);
    }

    /* ── Color / Size / Length pill filters ── */
    .gender-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .gender-chip {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      background: var(--white);
      color: var(--text-secondary);
      transition: all 0.2s;
    }
    .gender-chip.active {
      background: var(--black);
      color: var(--white);
      border-color: var(--black);
    }
    
    .color-dots {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }
    .color-dot-wrap {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .color-dot-wrap.active {
      border-color: var(--black);
    }
    .color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.1);
    }
    .option-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .option-pill {
      padding: 5px 13px;
      border: 1.5px solid var(--border);
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 500;
      font-family: var(--font-display);
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      cursor: pointer;
      background: var(--white);
      transition: all 0.18s;
      user-select: none;
    }
    .option-pill:hover { border-color: var(--black); color: var(--black); }
    .option-pill.active {
      background: var(--black);
      border-color: var(--black);
      color: var(--white);
    }

    /* ── Stock badge on cards ── */
    .stock-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 2px 8px;
      border-radius: 9999px;
      margin-top: 4px;
    }
    .stock-badge.in-stock  { background: #e6f4ea; color: #1a7a34; }
    .stock-badge.pre-order { background: #fff3e0; color: #b85c00; }

    @media (max-width: 768px) {
      .products-page-hero { padding: 28px 16px; }
      .products-page-hero h1 { font-size: clamp(1.5rem, 7vw, 2.5rem); }
      .products-page-hero p { font-size: 13px; }
    }
    @media (max-width: 480px) {
      .products-page-hero { padding: 24px 16px; }
    }

    /* ── PAGINATION CONTROLS ── */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: var(--sp-2);
      margin-top: 48px;
    }

    .pagination-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--white);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: var(--fw-semibold);
      font-family: var(--font-display);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .pagination-btn:hover:not(:disabled) {
      border-color: var(--black);
      background: var(--bg-secondary);
    }

    .pagination-btn.active {
      background: var(--black);
      border-color: var(--black);
      color: var(--white);
    }

    .pagination-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .pagination-arrow {
      width: 84px;
    }
  </style>
</head>
<body>

<!-- Navbar injected by app.js -->

<!-- PAGE HERO -->
<div class="products-page-hero">
  <h1>Our Collection</h1>
  <p>Discover premium Technology, curated for performance and style</p>
</div>

<!-- MOBILE FILTER OVERLAY -->
<div class="mobile-filter-overlay" id="mobile-filter-overlay" onclick="closeMobileFilter()"></div>

<!-- MOBILE FILTER DRAWER -->
<div class="mobile-filter-drawer" id="mobile-filter-drawer" role="dialog" aria-label="Product filters">
  <div class="filter-drawer-header">
    <span class="filter-drawer-title">Filters</span>
    <button class="filter-drawer-close" onclick="closeMobileFilter()" aria-label="Close filters">&times;</button>
  </div>
  <div class="filter-drawer-body" id="mobile-filter-body">
    <!-- Filter content is cloned here by JS -->
  </div>
  <div class="filter-drawer-footer">
    <button class="btn btn-primary" onclick="clearFilters(); closeMobileFilter()">Clear All</button>
    <button class="btn btn-outline" onclick="closeMobileFilter()">View Results</button>
  </div>
</div>

<!-- MAIN LAYOUT -->
<div class="page-container">

  <!-- SIDEBAR (desktop only) -->
  <aside class="sidebar" aria-label="Product filters" id="desktop-sidebar">

    <div class="filter-section">
      <h3 class="filter-title">Category</h3>
      <div id="category-filter-list" style="display:flex; flex-direction:column; gap:4px;">
        <!-- Dynamically loaded from API -->
        <label class="filter-item">
          <div class="checkbox-container">
            <input type="checkbox" id="cat-all" checked onchange="filterProducts(this)">
            <span>All Products</span>
          </div>
          <span class="item-count" id="cat-all-count">…</span>
        </label>
      </div>
    </div>



    <div class="filter-section">
      <h3 class="filter-title">Gender</h3>
      <div class="gender-chips" id="gender-chips">
        <!-- Dynamically loaded -->
        <span style="font-size:12px;color:var(--text-muted);">Loading…</span>
      </div>
    </div>

    <div class="filter-section">
      <h3 class="filter-title">Metal Colour</h3>
      <div class="color-dots" id="color-pills">
        <!-- Dynamically loaded -->
        <span style="font-size:12px;color:var(--text-muted);">Loading…</span>
      </div>
    </div>

    <div class="filter-section">
      <h3 class="filter-title">Size</h3>
      <div class="option-pills" id="size-pills">
        <!-- Dynamically loaded -->
        <span style="font-size:12px;color:var(--text-muted);">Loading…</span>
      </div>
    </div>

    <div class="filter-section">
      <h3 class="filter-title">Length</h3>
      <div class="option-pills" id="length-pills">
        <!-- Dynamically loaded -->
        <span style="font-size:12px;color:var(--text-muted);">Loading…</span>
      </div>
    </div>

    <div class="filter-section">
      <h3 class="filter-title">Price Range</h3>
      <div class="price-range-inputs">
        <input type="number" id="price-min" placeholder="Rs. 1000" min="0" aria-label="Minimum price">
        <span class="range-separator">—</span>
        <input type="number" id="price-max" placeholder="Rs. 25000" min="0" aria-label="Maximum price">
      </div>
      <input type="range" id="price-slider" min="0" max="100000" step="1000" value="100000" style="width:100%; margin-top:12px;" onchange="document.getElementById('price-max').value = this.value; applyPriceFilter()">
      <button class="btn btn-outline btn-sm" style="width:100%; margin-top:12px; justify-content:center;" onclick="applyPriceFilter()">Apply</button>
    </div>

    <div class="filter-section">
      <h3 class="filter-title">Availability</h3>
      <div style="display:flex; flex-direction:column; gap:4px;">
        <label class="filter-item">
          <div class="checkbox-container">
            <input type="checkbox" id="avail-instock" onchange="applyFilters()">
            <span>In Stock</span>
          </div>
          <span class="item-count" id="avail-instock-count">–</span>
        </label>
        <label class="filter-item">
          <div class="checkbox-container">
            <input type="checkbox" id="avail-outofstock" onchange="applyFilters()">
            <span>Out of Stock</span>
          </div>
          <span class="item-count" id="avail-outofstock-count">–</span>
        </label>
      </div>
    </div>

    <button class="btn btn-primary btn-sm" style="width:100%; justify-content:center;" onclick="clearFilters()">Clear All Filters</button>

  </aside>

  <!-- PRODUCTS MAIN -->
  <main id="products-main">

    <!-- Mobile filter trigger + filter tags row -->
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:4px;">
      <button class="mobile-filter-trigger" id="mobile-filter-trigger" onclick="openMobileFilter()" aria-label="Open filters">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M7.5 12h9m-5.25 5.25h1.5"/></svg>
        Filters
      </button>
    </div>

    <!-- Filter Tags (dynamically built) -->
    <div class="filter-tags" id="filter-tags-bar">
      <button class="filter-tag active" data-cat="" onclick="setActiveTag(this)">All</button>
    </div>

    <!-- Collection Header -->
    <div class="collection-header">
      <div>
        <h2 class="collection-title" id="collection-title">All Products</h2>
        <p class="collection-count" style="font-size:13px;color:var(--text-muted);margin-top:2px;">Loading…</p>
      </div>
      <div class="collection-sort">
        <label for="sort-select" style="font-size:12px;color:var(--text-muted);letter-spacing:0.06em;">Sort by:</label>
        <select id="sort-select" onchange="sortProducts(this.value)" aria-label="Sort products by">
          <option value="featured">Featured</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="newest">Newest</option>
          <option value="rating">Best Rating</option>
        </select>
      </div>
    </div>

    <!-- Product Grid -->
    <div class="product-grid" id="product-grid">
      <!-- Dynamic products loaded by JS -->
    </div>

    <!-- Loading state -->
    <div id="products-loading" style="display:flex; justify-content:center; align-items:center; min-height:300px; color:var(--text-muted); font-size:14px; gap:10px;">
      <svg style="animation:spin 0.8s linear infinite;" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
      Loading products…
    </div>

    <!-- Empty state -->
    <div id="products-empty" style="display:none; text-align:center; padding:48px 16px; color:var(--text-muted); font-size:14px;">
      <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="margin:0 auto 16px; display:block; opacity:0.4;"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"/></svg>
      No products found.
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination-wrap">
      <!-- Controls will be dynamically rendered here -->
    </div>

  </main>

</div><!-- end page-container -->

<!-- Footer injected by app.js -->
<script>window.deferGlobalLoader = true;</script>
<script src="js/app.js"></script>
<script>
  const FALLBACK_IMG = 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&q=80';
  let allProducts    = [];   // mapped product data
  let allCategories  = [];   // from API
  let activeCategoryName = ''; // '' = All

  let selectedColors   = new Set(); // empty = all colors
  let selectedSizes = new Set(); // empty = all Size / Lengths
  let selectedGenders  = new Set(); // empty = all genders
  let currentPage = 1;
  const itemsPerPage = 8;

  /* ─── Bootstrap ─── */
  document.addEventListener('DOMContentLoaded', async () => {
    const urlParams   = new URLSearchParams(window.location.search);
    const urlCategory = (urlParams.get('category') || '').trim();

    try {
      const [catRes, prodRes] = await Promise.all([
        fetch('api/products?view=categories'),
        fetch('api/products')
      ]);
      const catData  = await catRes.json();
      const prodData = await prodRes.json();

      /* ── Categories ── */
      if (catData.success && catData.categories) {
        allCategories = catData.categories;
        buildCategorySidebar(allCategories);
        buildFilterTags(allCategories);
      }

      /* ── Products ── */
      document.getElementById('products-loading').style.display = 'none';
      if (prodData.success && prodData.products && prodData.products.length > 0) {
        allProducts = prodData.products.map(p => ({
          id:          p.id,
          variantId:   p.variantId || 0,
          displayName: p.name || 'Product',
          name:        (p.name || '').toLowerCase(),
          price:       parseFloat(p.price || 0),
          compareAtPrice: parseFloat(p.compareAtPrice || 0),
          variants:    p.variants || [],
          category:    p.category || '',
          brand:       p.brand    || '',
          brandLower:  (p.brand || '').toLowerCase(),
          gender:      p.gender   || '',
          colors:      (p.colors  || []).map(c => c.trim()).filter(Boolean),
          sizes:    (p.sizes || []).map(s => s.trim()).filter(Boolean),
          inStock:     !!p.inStock,
          img:         p.primaryImage || FALLBACK_IMG,
          rating:      parseFloat(p.rating || 0),
          wishlistCount: parseInt(p.wishlistCount || 0),
          createdAt:   p.createdAt || ''
        }));

        /* Build dynamic Brand / Color / Size / Length filters */

        buildGenderChips(allProducts);
        buildColorPills(allProducts);
        buildSizeLengthPills(allProducts);
        updateAvailabilityCounts(allProducts);
      } else {
        document.getElementById('products-empty').style.display = 'block';
        clearDynamicFilterPlaceholders();
      }

      /* ── Pre-select category from URL ── */
      if (urlCategory) {
        activeCategoryName = urlCategory;
        document.getElementById('cat-all').checked = false;
        const cb = document.getElementById(categoryNameToId(urlCategory));
        if (cb) cb.checked = true;
        document.querySelectorAll('.filter-tag').forEach(tag =>
          tag.classList.toggle('active', tag.dataset.cat.toLowerCase() === urlCategory.toLowerCase()));
        document.getElementById('collection-title').textContent = urlCategory;
      }

    } catch (err) {
      console.error('[Products] Failed to load:', err);
      document.getElementById('products-loading').style.display = 'none';
      document.getElementById('products-empty').style.display = 'block';
      clearDynamicFilterPlaceholders();
    } finally {
      document.body.classList.add('loaded');
    }

    applyFilters();
  });

  /* ─── Dynamic sidebar builders ─── */

  function buildCategorySidebar(categories) {
    const list = document.getElementById('category-filter-list');
    const total = categories.reduce((s, c) => s + (c.productCount || 0), 0);
    document.getElementById('cat-all-count').textContent = total;
    categories.forEach(c => {
      const id = categoryNameToId(c.name);
      const label = document.createElement('label');
      label.className = 'filter-item';
      label.innerHTML = `
        <div class="checkbox-container">
          <input type="checkbox" id="${id}" data-catname="${c.name}" onchange="filterProducts(this)">
          <span>${c.name}</span>
        </div>
        <span class="item-count">${c.productCount || 0}</span>`;
      list.appendChild(label);
    });
  }

  function buildFilterTags(categories) {
    const bar = document.getElementById('filter-tags-bar');
    categories.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'filter-tag';
      btn.dataset.cat = c.name;
      btn.textContent = c.name;
      btn.onclick = () => setActiveTag(btn);
      bar.appendChild(btn);
    });
  }



  function buildGenderChips(products) {
    const wrap = document.getElementById('gender-chips');
    wrap.innerHTML = '';
    const allGenders = [...new Set(products.map(p => p.gender).filter(g => g))].sort();
    if (allGenders.length === 0) {
      wrap.innerHTML = '<span style="font-size:12px;color:var(--text-muted);">No genders</span>';
      return;
    }
    allGenders.forEach(g => {
      const chip = document.createElement('button');
      chip.className = 'gender-chip';
      chip.textContent = g;
      chip.dataset.gender = g;
      chip.onclick = () => togglePill(chip, selectedGenders, g);
      wrap.appendChild(chip);
    });
  }

  function getColorHex(colorName) {
    const map = {
      'yellow gold': 'linear-gradient(135deg, #f5d060, #d4a017, #f5d060)',
      '22k yellow gold': 'linear-gradient(135deg, #f5d060, #d4a017, #f5d060)',
      '18k yellow gold': 'linear-gradient(135deg, #f5d060, #d4a017, #f5d060)',
      'white gold': '#F5F5DC',
      '18k white gold': '#F5F5DC',
      'rose gold': 'linear-gradient(135deg, #f0b8b8, #B76E79, #f0b8b8)',
      '18k rose gold': 'linear-gradient(135deg, #f0b8b8, #B76E79, #f0b8b8)',
      'platinum': '#E5E4E2',
      'silver': 'linear-gradient(135deg, #e8e8e8, #a8a8a8, #d8d8d8)',
      'gold': 'linear-gradient(135deg, #f5d060, #d4a017, #f5d060)',
      'black gold': '#36454F',
      'black': '#1a1a1a',
      'white': '#f5f5f5'
    };
    return map[(colorName || '').toLowerCase()] || '#888888';
  }

  function buildColorPills(products) {
    const wrap = document.getElementById('color-pills');
    wrap.innerHTML = '';
    const allColors = [...new Set(products.flatMap(p => p.colors))].sort();
    if (allColors.length === 0) {
      wrap.innerHTML = '<span style="font-size:12px;color:var(--text-muted);">No colors</span>';
      return;
    }
    allColors.forEach(color => {
      const dotWrap = document.createElement('div');
      dotWrap.className = 'color-dot-wrap';
      dotWrap.title = color;
      dotWrap.dataset.color = color;
      
      const dot = document.createElement('div');
      dot.className = 'color-dot';
      dot.style.background = getColorHex(color);
      
      dotWrap.appendChild(dot);
      dotWrap.onclick = () => togglePill(dotWrap, selectedColors, color);
      wrap.appendChild(dotWrap);
    });
  }

  function buildSizeLengthPills(products) {
    const sizeWrap = document.getElementById('size-pills');
    const lengthWrap = document.getElementById('length-pills');
    sizeWrap.innerHTML = '';
    lengthWrap.innerHTML = '';
    const allSizes = [...new Set(products.flatMap(p => p.sizes))]
      .sort((a, b) => {
        // Sort numerically by the leading number
        const na = parseInt(a) || 0, nb = parseInt(b) || 0;
        return na - nb;
      });
      
    let hasSizes = false;
    let hasLengths = false;

    allSizes.forEach(s => {
      const pill = document.createElement('button');
      pill.className = 'option-pill';
      pill.textContent = s;
      pill.dataset.sizeLength = s;
      pill.onclick = () => togglePill(pill, selectedSizes, s);
      
      if (s.toLowerCase().includes('inch')) {
        lengthWrap.appendChild(pill);
        hasLengths = true;
      } else {
        sizeWrap.appendChild(pill);
        hasSizes = true;
      }
    });
    
    if (!hasSizes) sizeWrap.innerHTML = '<span style="font-size:12px;color:var(--text-muted);">No size options</span>';
    if (!hasLengths) lengthWrap.innerHTML = '<span style="font-size:12px;color:var(--text-muted);">No length options</span>';
  }

  function updateAvailabilityCounts(products) {
    const inStockCount   = products.filter(p => p.inStock).length;
    const outOfStockCount  = products.filter(p => !p.inStock).length;
    document.getElementById('avail-instock-count').textContent  = inStockCount;
    document.getElementById('avail-outofstock-count').textContent = outOfStockCount;
  }

  function clearDynamicFilterPlaceholders() {
    ['gender-chips','color-pills','size-pills','length-pills'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = '<span style="font-size:12px;color:var(--text-muted);">None</span>';
    });
  }

  /* ─── Pill toggle helper ─── */
  function togglePill(pill, activeSet, value) {
    if (activeSet.has(value)) {
      activeSet.delete(value);
      pill.classList.remove('active');
    } else {
      activeSet.add(value);
      pill.classList.add('active');
    }
    currentPage = 1;
    applyFilters();
  }



  /* ─── Helpers ─── */
  function categoryNameToId(name) {
    return 'cat-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+$/, '');
  }

  /* ─── Build a product card HTML ─── */
  function buildCard(p) {
    const safeName = p.displayName.replace(/'/g, "\\'");
    const stockBadge = p.inStock
      ? '<span class="stock-badge in-stock" style="display:inline-flex; align-items:center; gap:4px;"><svg style="width:12px;height:12px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> In Stock</span>' 
      : '<span class="stock-badge out-of-stock" style="display:inline-flex; align-items:center; gap:4px;"><svg style="width:12px;height:12px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg> Out of Stock</span>';
    const roundedRating = Math.round(p.rating || 0);
    const starSvg = '<svg style="width:12px;height:12px;" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>';
    const emptyStarSvg = '<svg style="width:12px;height:12px;color:#d1d5db;" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>';
    const starsHtml = `<span class="star" style="display:inline-flex;align-items:center;">${starSvg}</span>`.repeat(roundedRating) + `<span class="star" style="display:inline-flex;align-items:center;">${emptyStarSvg}</span>`.repeat(5 - roundedRating);
    
    const hasMultipleVariants = (p.variants && p.variants.length > 1) || (p.colors && p.colors.length > 1) || (p.sizes && p.sizes.length > 1);
    const btnHtml = hasMultipleVariants
      ? `<button class="product-quick-add" onclick="event.stopPropagation(); window.location='product-view.html?id=${p.id}'">Select Options</button>`
      : `<button class="product-quick-add" onclick="event.stopPropagation(); addToCart({id:${p.id},variantId:${p.variantId || 0},name:'${safeName}',price:${p.price},img:'${p.img}'})">Quick Add</button>`;

    const optImg = window.optimizeImageUrl ? window.optimizeImageUrl(p.img, 450) : p.img;
    return `
      <article class="product-card" style="cursor:pointer;" onclick="window.location='product-view.html?id=${p.id}'">
        <div class="product-image-wrap">
          <img src="${optImg}" alt="${p.displayName}" loading="lazy" decoding="async">
          ${btnHtml}
        </div>
        <div class="product-info">
          <p style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); margin-bottom:4px;">${p.brand || 'Ceylon Letter Co.'}</p>
          <p class="product-name">${p.displayName}</p>
          <div class="product-price"><span class="price-new">Rs. ${p.price.toFixed(2)}</span></div>
          <div class="product-stars">${starsHtml}</div>
          ${stockBadge}
        </div>
      </article>`;
  }

  /* ─── Apply all filters, sort, paginate and render ─── */
  function applyFilters() {
    const urlParams  = new URLSearchParams(window.location.search);
    const searchVal  = (urlParams.get('q') || '').trim().toLowerCase();
    const priceMin   = parseFloat(document.getElementById('price-min').value)  || 0;
    const priceMax   = parseFloat(document.getElementById('price-max').value)  || Infinity;
    const wantInStock   = document.getElementById('avail-instock')?.checked;
    const wantOutOfStock  = document.getElementById('avail-outofstock')?.checked;

    let filtered = allProducts.filter(p => {
      // Search
      if (searchVal && !p.name.includes(searchVal) && !p.brandLower.includes(searchVal)) return false;
      // Category
      if (activeCategoryName && p.category.toLowerCase() !== activeCategoryName.toLowerCase()) return false;
      // Gender
      if (selectedGenders.size > 0 && !selectedGenders.has(p.gender)) return false;

      // Color
      if (selectedColors.size > 0 && !p.colors.some(c => selectedColors.has(c))) return false;
      // Size / Length
      if (selectedSizes.size > 0 && !p.sizes.some(s => selectedSizes.has(s))) return false;
      // Price
      if (p.price < priceMin || p.price > priceMax) return false;
      // Availability (both unchecked = show all)
      if (wantInStock || wantOutOfStock) {
        if (wantInStock && wantOutOfStock) { /* show all */ }
        else if (wantInStock  && !p.inStock)  return false;
        else if (wantOutOfStock &&  p.inStock)  return false;
      }
      
      // Discount
      if (urlParams.get('discount') === 'true') {
        let hasDiscount = false;
        if (p.variants && p.variants.length > 0) {
          hasDiscount = p.variants.some(v => parseFloat(v.compareAtPrice || 0) > parseFloat(v.price || 0));
        } else {
          hasDiscount = p.compareAtPrice > p.price;
        }
        if (!hasDiscount) return false;
      }
      
      return true;
    });

    const sortBy = document.getElementById('sort-select').value;
    if (sortBy === 'price-low')  filtered.sort((a, b) => a.price - b.price);
    else if (sortBy === 'price-high') filtered.sort((a, b) => b.price - a.price);
    else if (sortBy === 'newest') {
      filtered.sort((a, b) => {
        const da = new Date(a.createdAt || 0);
        const db = new Date(b.createdAt || 0);
        return db - da; // newest first
      });
    }
    else if (sortBy === 'rating') {
      filtered.sort((a, b) => b.rating - a.rating); // highest rating first
    }
    else if (sortBy === 'featured') {
      filtered.sort((a, b) => b.wishlistCount - a.wishlistCount); // highest wishlist count first
    }

    renderPage(filtered);
  }

  /* ── Render one page ── */
  function renderPage(filtered) {
    const grid      = document.getElementById('product-grid');
    const emptyEl   = document.getElementById('products-empty');
    const totalItems = filtered.length;
    const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;

    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const startIdx = (currentPage - 1) * itemsPerPage;
    const endIdx   = startIdx + itemsPerPage;
    const pageSlice = filtered.slice(startIdx, endIdx);

    grid.innerHTML = '';
    emptyEl.style.display = pageSlice.length === 0 ? 'block' : 'none';
    pageSlice.forEach(p => grid.insertAdjacentHTML('beforeend', buildCard(p)));

    // Count text
    const countText = document.querySelector('.collection-count');
    if (countText) {
      countText.textContent = totalItems === 0
        ? 'No products found'
        : `Showing ${startIdx + 1}–${Math.min(endIdx, totalItems)} of ${totalItems} products`;
    }

    // Pagination
    const paginationWrap = document.getElementById('pagination-wrap');
    if (!paginationWrap) return;
    paginationWrap.innerHTML = '';
    if (totalItems === 0) return;

    const prevBtn = document.createElement('button');
    prevBtn.className = 'pagination-btn pagination-arrow';
    prevBtn.textContent = 'Previous';
    prevBtn.disabled = currentPage === 1;
    prevBtn.onclick = () => { currentPage--; applyFilters(); window.scrollTo({ top: 180, behavior: 'smooth' }); };
    paginationWrap.appendChild(prevBtn);

    for (let i = 1; i <= totalPages; i++) {
      const numBtn = document.createElement('button');
      numBtn.className = `pagination-btn ${i === currentPage ? 'active' : ''}`;
      numBtn.textContent = i;
      numBtn.onclick = () => { currentPage = i; applyFilters(); window.scrollTo({ top: 180, behavior: 'smooth' }); };
      paginationWrap.appendChild(numBtn);
    }

    const nextBtn = document.createElement('button');
    nextBtn.className = 'pagination-btn pagination-arrow';
    nextBtn.textContent = 'Next';
    nextBtn.disabled = currentPage === totalPages;
    nextBtn.onclick = () => { currentPage++; applyFilters(); window.scrollTo({ top: 180, behavior: 'smooth' }); };
    paginationWrap.appendChild(nextBtn);
  }

  /* ── Category checkbox (sidebar) changed ── */
  function filterProducts(checkbox) {
    if (checkbox.id === 'cat-all' && checkbox.checked) {
      document.querySelectorAll('#category-filter-list input[type="checkbox"]').forEach(cb => {
        if (cb.id !== 'cat-all') cb.checked = false;
      });
      activeCategoryName = '';
      document.getElementById('collection-title').textContent = 'All Products';
    } else if (checkbox.id !== 'cat-all' && checkbox.checked) {
      document.getElementById('cat-all').checked = false;
      document.querySelectorAll('#category-filter-list input[type="checkbox"]').forEach(cb => {
        if (cb !== checkbox && cb.id !== 'cat-all') cb.checked = false;
      });
      activeCategoryName = checkbox.dataset.catname || '';
      document.getElementById('collection-title').textContent = activeCategoryName;
    } else {
      document.getElementById('cat-all').checked = true;
      activeCategoryName = '';
      document.getElementById('collection-title').textContent = 'All Products';
    }
    syncTopTags();
    currentPage = 1;
    applyFilters();
  }

  /* ── Sync top tag pills ── */
  function syncTopTags() {
    document.querySelectorAll('.filter-tag').forEach(tag => {
      const tagCat = tag.dataset.cat || '';
      tag.classList.toggle('active', tagCat.toLowerCase() === activeCategoryName.toLowerCase());
    });
  }

  /* ── Top tag pill clicked ── */
  function setActiveTag(btn) {
    const catName = btn.dataset.cat || '';
    activeCategoryName = catName;
    document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('#category-filter-list input[type="checkbox"]').forEach(cb => {
      if (catName === '') cb.checked = cb.id === 'cat-all';
      else {
        cb.checked = (cb.dataset.catname || '').toLowerCase() === catName.toLowerCase();
        if (cb.id === 'cat-all') cb.checked = false;
      }
    });
    if (catName === '') document.getElementById('cat-all').checked = true;
    document.getElementById('collection-title').textContent = catName || 'All Products';
    currentPage = 1;
    applyFilters();
  }

  function applyPriceFilter() { currentPage = 1; applyFilters(); }

  function sortProducts() { currentPage = 1; applyFilters(); }

  /* ── Clear ALL filters ── */
  function clearFilters() {
    activeCategoryName = '';

    selectedColors.clear();
    selectedSizes.clear();
    selectedGenders.clear();

    document.querySelectorAll('#category-filter-list input[type="checkbox"]').forEach(cb => { cb.checked = cb.id === 'cat-all'; });

    document.querySelectorAll('.option-pill, .color-dot-wrap, .gender-chip').forEach(p => p.classList.remove('active'));
    document.getElementById('avail-instock').checked = false;
    document.getElementById('avail-outofstock').checked = false;
    document.getElementById('price-min').value = '';
    document.getElementById('price-max').value = '';
    document.getElementById('collection-title').textContent = 'All Products';

    if (window.location.search.includes('q=') || window.location.search.includes('category=')) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }
    syncTopTags();
    currentPage = 1;
    applyFilters();
  }

  /* ── Mobile Filter Drawer ── */
  function openMobileFilter() {
    const overlay = document.getElementById('mobile-filter-overlay');
    const drawer  = document.getElementById('mobile-filter-drawer');
    const body    = document.getElementById('mobile-filter-body');
    const sidebar = document.getElementById('desktop-sidebar');

    // Clone sidebar content into drawer
    if (sidebar && body) {
      body.innerHTML = sidebar.innerHTML;
      // Wire up all cloned inputs/buttons to the same handlers
      body.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        const orig = sidebar.querySelector('#' + cb.id);
        if (orig) {
          cb.checked = orig.checked;
          cb.addEventListener('change', function() {
            const origEl = document.getElementById(this.id);
            if (origEl) { origEl.checked = this.checked; origEl.dispatchEvent(new Event('change')); }
          });
        }
      });
      body.querySelectorAll('input[type="number"]').forEach(inp => {
        const orig = document.getElementById(inp.id);
        if (orig) { inp.value = orig.value; inp.addEventListener('input', function() { const o = document.getElementById(this.id); if(o) o.value = this.value; }); }
      });
      // Color / Size / Length pills
      body.querySelectorAll('.option-pill, .color-dot-wrap, .gender-chip').forEach(pill => {
        const color = pill.dataset.color;
        const sizeLength = pill.dataset.sizeLength;
        const gender = pill.dataset.gender;
        if (color && selectedColors.has(color)) pill.classList.add('active');
        if (sizeLength && selectedSizes.has(sizeLength)) pill.classList.add('active');
        if (gender && selectedGenders.has(gender)) pill.classList.add('active');
        pill.onclick = function() {
          const orig = sidebar.querySelector(color ? `[data-color="${color}"]` : 
            (gender ? `[data-gender="${gender}"]` : `[data-size-length="${sizeLength}"]`));
          if (orig) orig.click();
          this.classList.toggle('active');
        };
      });
    }

    overlay.classList.add('open');
    drawer.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.documentElement.style.overflow = 'hidden';
  }

  function closeMobileFilter() {
    document.getElementById('mobile-filter-overlay').classList.remove('open');
    document.getElementById('mobile-filter-drawer').classList.remove('open');
    document.body.style.overflow = '';
    document.documentElement.style.overflow = '';
  }

  // Close drawer on Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeMobileFilter();
  });
</script>
</body>
</html>
