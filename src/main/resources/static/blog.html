<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AuraCraft Studio Journal – Inspiration, styling ideas, and updates about new jewellery collections.">
  <title>AuraCraft Studio – Journal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500"
    rel="stylesheet">

  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/navbar.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/footer.css">

  <style>
    .blog-layout {
      max-width: var(--max-width);
      margin: 60px auto 100px auto;
      padding: 0 var(--sp-8);
    }

    .blog-header {
      text-align: center;
      margin-bottom: 60px;
    }

    .blog-header h1 {
      font-size: var(--text-3xl);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: var(--sp-3);
    }

    /* Featured Post Card */
    .blog-featured {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      margin-bottom: 60px;
      background: var(--bg-primary);
      transition: all var(--transition-base);
    }

    .blog-featured:hover {
      border-color: var(--black);
    }

    .featured-img-wrap {
      aspect-ratio: 16/10;
      background: var(--bg-secondary);
      overflow: hidden;
    }

    .featured-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform var(--transition-slow);
    }

    .blog-featured:hover .featured-img-wrap img {
      transform: scale(1.03);
    }

    .featured-body {
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .post-tag {
      display: inline-block;
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .post-title {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.2;
      margin-bottom: 16px;
      color: var(--black);
    }

    .post-summary {
      font-size: var(--text-sm);
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .post-meta {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    /* Grid layout */
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
    }

    .blog-card {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: all var(--transition-base);
    }

    .blog-card:hover {
      border-color: var(--black);
    }

    .card-img-wrap {
      aspect-ratio: 16/10;
      overflow: hidden;
      background: var(--bg-secondary);
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform var(--transition-slow);
    }

    .blog-card:hover .card-img-wrap img {
      transform: scale(1.03);
    }

    .card-body {
      padding: 24px;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: var(--text-md);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.3;
      margin-bottom: 12px;
      color: var(--black);
    }

    @media (max-width: 1024px) {
      .blog-featured {
        grid-template-columns: 1fr;
        gap: 0;
      }
      .featured-body {
        padding: 32px;
      }
      .blog-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .blog-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar injected by app.js -->

  <div class="blog-layout">
    <div class="blog-header reveal">
      <h1>Journal</h1>
      <p style="color:var(--text-secondary);">Our Journal shares inspiration, styling ideas, and updates about new collections.</p>
    </div>

    <!-- Featured Post -->
    <article class="blog-featured reveal">
      <div class="featured-img-wrap">
        <img src="images/journal.png" alt="Beautiful jewellery styling">
      </div>
      <div class="featured-body">
        <span class="post-tag">Styling • Inspiration</span>
        <h2 class="post-title"><a href="#">What you'll find here</a></h2>
        <ul style="padding-left: 20px; list-style-type: square; color: var(--text-secondary); line-height: 1.7; font-size: var(--text-sm);">
          <li>Jewellery styling tips</li>
          <li>Gift ideas</li>
          <li>New collection updates</li>
          <li>Fashion inspiration</li>
        </ul>
      </div>
    </article>
  </div>

  <!-- Footer injected by app.js -->
  <script src="js/app.js"></script>
</body>

</html>
