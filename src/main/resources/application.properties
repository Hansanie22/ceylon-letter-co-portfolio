server.port=${PORT:8080}

server.servlet.context-path=/
spring.application.name=CeylonLetterCo

# ── Static resources (HTML/CSS/JS served from src/main/resources/static) ──

# ════════════════════════════════════════════════════════════════════
#  DATABASE  –  Fill in your MySQL details here (Supports Render / Aiven env vars)
# ════════════════════════════════════════════════════════════════════
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ceylonletterco?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Hansanie2002@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ════════════════════════════════════════════════════════════════════
#  JPA / HIBERNATE
# ════════════════════════════════════════════════════════════════════
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
# Allow Hibernate to ignore missing join columns gracefully
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# ════════════════════════════════════════════════════════════════════
#  EMAIL  –  Gmail App Password configured via Environment Variables
# ════════════════════════════════════════════════════════════════════
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:ceylonletterco@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# ════════════════════════════════════════════════════════════════════
#  APPLICATION-SPECIFIC & OAUTH
# ════════════════════════════════════════════════════════════════════
# Google OAuth2
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:tojccyg8}
cloudinary.api-key=${CLOUDINARY_API_KEY:372842354576741}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:gnb85VmLeC1DFZAZb7IRgjyT6tw}

# From address for no-reply emails
app.mail.noreply.from=Ceylon Letter Co <ceylonletterco@gmail.com>

# From address for marketing/info emails
app.mail.info.from=Ceylon Letter Co <ceylonletterco@gmail.com>

# OAuth properties file location
app.oauth.properties-path=classpath:ceylonletterco_oauth.properties

# Google Sheets API Webhook URL (For Real-time Order Sync)
app.google.sheets.webhook-url=${GOOGLE_SHEETS_WEBHOOK_URL:https://script.google.com/macros/s/AKfycbz6BfcpHX9Wj6mZHUkgLde-ZQXCYI8eiwO7RCIH2N58My_ICgfjxO-6E-Zm6d-z7hA/exec}

# ════════════════════════════════════════════════════════════════════
#  MULTIPART (file uploads – AvatarUpload, AdminProduct images)
# ════════════════════════════════════════════════════════════════════
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ════════════════════════════════════════════════════════════════════
#  SESSION
# ════════════════════════════════════════════════════════════════════
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=2592000
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.path=/

# ════════════════════════════════════════════════════════════════════
#  LOGGING
# ════════════════════════════════════════════════════════════════════
logging.level.root=INFO
logging.level.com.ceylonletterco=DEBUG
logging.file.name=logs/ceylonletterco.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
